resources:
  jobs:
    gold_dimensions:
      name: AirLake-${bundle.target}-gold-dimensions
      max_concurrent_runs: 1
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      tasks:
        - task_key: gold_dimensions
          for_each_task:
            inputs: '["airports", "flights", "passengers"]'
            concurrency: 3
            task:
              task_key: gold_dimension
              environment_key: Default
              notebook_task:
                notebook_path: ../src/notebooks/GoldLayer_dims.py
                source: WORKSPACE
                base_parameters:
                  dimension: "{{input}}"
                  catalog: "${var.catalog}"
                  source_schema: "${var.silver_schema}"
                  target_schema: "${var.gold_schema}"
                  #backdated_refresh: ""

        - task_key: gold_fact
          depends_on:
            - task_key: gold_dimensions
          environment_key: Default
          notebook_task:
            notebook_path: ../src/notebooks/GoldLayer_fact.py
            source: WORKSPACE
            base_parameters:
              catalog: "${var.catalog}"
              source_schema: "${var.silver_schema}"
              target_schema: "${var.gold_schema}"