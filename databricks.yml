# This is a Declarative Automation Bundle definition for AirLake-1.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: AirLake-2026

variables:
  catalog:
    default: workspace
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  raw_source_schema:
    default: raw_source_schema
  raw_source_volume:
    default: raw_source_volume
  raw_volume:
    default: /Volumes/${var.catalog}/${var.raw_source_schema}/${var.raw_source_volume}/raw_data

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true