resources:
  pipelines:
    airlake_silver:
      name: AirLake-${bundle.target}-silver-pipeline
      catalog: "${var.catalog}"
      schema: "${var.silver_schema}"
      configuration:
        airlake.bronze_volume: "${var.bronze_volume}"
      serverless: true
      development: true
      libraries:
        - file:
            path: ../src/Pipelines/silver_tables/silver_airports.py
        - file:
            path: ../src/Pipelines/silver_tables/silver_bookings.py
        - file:
            path: ../src/Pipelines/silver_tables/silver_flights.py
        - file:
            path: ../src/Pipelines/silver_tables/silver_passengers.py
        - file:
          path: ../src/Pipelines/silver_views/silver_business_mat_view.py
